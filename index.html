<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webamp Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    #webamp-mount {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #webamp-mount .winamp-skin-container {
      transform-origin: center center;
    }
  </style>
</head>
<body>
  <div id="webamp-mount"></div>
  <script type="module">
    import Webamp from "https://unpkg.com/webamp@2.3.1/built/webamp.bundle.min.mjs";

    const tracks = [
      { url: "1 lean into it.mp3", defaultName: "Lean Into It" },
      { url: "2 lies.mp3", defaultName: "Lies" },
      { url: "3 positivity.mp3", defaultName: "Positivity" },
      { url: "4 cruel by design.mp3", defaultName: "Cruel By Design" },
      { url: "5 sac max.mp3", defaultName: "SAC Max" },
      { url: "6 strange magic.mp3", defaultName: "Strange Magic" },
      { url: "7 can't dance.mp3", defaultName: "Can't Dance" },
      { url: "8 toxic.mp3", defaultName: "Toxic" }
    ];

    const mount = document.getElementById("webamp-mount");

    const webamp = new Webamp();
    webamp.renderInto(mount).then(() => {
      webamp.setTracksToPlay(tracks);
      fitToScreen();
    });

    function fitToScreen() {
      // Webamp default skin size
      const skinWidth = 564;
      const skinHeight = 224;
      const scale = Math.min(
        window.innerWidth / skinWidth,
        window.innerHeight / skinHeight
      );
      const el = mount.querySelector(".winamp-skin-container");
      if (el) {
        el.style.transform = `scale(${scale})`;
      }
    }

    window.addEventListener("resize", () => {
      setTimeout(fitToScreen, 100);
    });
  </script>
</body>
</html>

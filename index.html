<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webamp Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
  <script type="module">
    import Webamp from "https://unpkg.com/webamp@2.3.1/built/webamp.bundle.min.mjs";

    const tracks = [
      { url: "1 lean into it.mp3", defaultName: "Lean Into It" },
      { url: "2 lies.mp3", defaultName: "Lies" },
      { url: "3 positivity.mp3", defaultName: "Positivity" },
      { url: "4 cruel by design.mp3", defaultName: "Cruel By Design" },
      { url: "5 sac max.mp3", defaultName: "SAC Max" },
      { url: "6 strange magic.mp3", defaultName: "Strange Magic" },
      { url: "7 can't dance.mp3", defaultName: "Can't Dance" },
      { url: "8 toxic.mp3", defaultName: "Toxic" }
    ];

    const webamp = new Webamp();
    webamp.setTracksToPlay(tracks);
  </script>
</head>
<body></body>
</html>
